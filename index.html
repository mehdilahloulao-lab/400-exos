<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, memoryLocalCache, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app = initializeApp({"apiKey":"AIzaSyDAI4QW6za-jtUJY0iUB-Hxshju9rpMm4Y","authDomain":"exos-e6fdd.firebaseapp.com","projectId":"exos-e6fdd","storageBucket":"exos-e6fdd.firebasestorage.app","messagingSenderId":"245913938267","appId":"1:245913938267:web:534baba127014ac69e527e"});
const auth = getAuth(app);
let fs;
try{ fs = initializeFirestore(app, {ignoreUndefinedProperties: true, localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
catch(e){ fs = initializeFirestore(app, {ignoreUndefinedProperties: true, localCache: memoryLocalCache()}); }
window.FB = {
  onAuth: cb => onAuthStateChanged(auth, cb),
  signIn: (e, p) => signInWithEmailAndPassword(auth, e, p),
  signUp: (e, p) => createUserWithEmailAndPassword(auth, e, p),
  reset: e => sendPasswordResetEmail(auth, e),
  signOut: () => signOut(auth),
  db(uid){
    return { collection(name){
      const col = collection(fs, "users", uid, name);
      return {
        doc(id){ const r = doc(col, id); return { set: d => setDoc(r, d), delete: () => deleteDoc(r) }; },
        onSnapshot(cb, err){ return onSnapshot(col, {includeMetadataChanges: true}, cb, err); }
      };
    } };
  },
  async batchSet(uid, name, obj){
    const ents = Object.entries(obj); let n = 0;
    for(let i = 0; i < ents.length; i += 400){
      const b = writeBatch(fs);
      ents.slice(i, i + 400).forEach(([id, v]) => { b.set(doc(fs, "users", uid, name, id), v); n++; });
      await b.commit();
    }
    return n;
  }
};
window.dispatchEvent(new Event("fb-ready"));
</script>

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 80px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
h1,h2,h3{text-wrap:balance;margin:0}
h1,h2{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em}
a{color:inherit} button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
mjx-container[jax="SVG"]{font-size:104%} mjx-container[jax="SVG"] svg{overflow:visible}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:58px}
.brand{font-family:var(--f-display);font-size:19px;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.nav a{padding:7px 14px;border-radius:7px;text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.nav a[aria-current="page"]{background:var(--fg);color:var(--bg)}
.nav .c{font-family:var(--f-mono);font-size:11.5px;margin-left:5px;opacity:.75}
.nav a{position:relative;display:flex;align-items:center;gap:7px}
.nav a svg{display:none;width:22px;height:22px}
.nav .c:empty{display:none}
@media (max-width:759px){
  .top-in{min-height:50px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;border-radius:0;border:0;border-top:1px solid var(--line);background:var(--surface);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:0}
  .nav a{flex:1;flex-direction:column;gap:2px;padding:6px 4px;font-size:11.5px;background:none!important;color:var(--faint)}
  .nav a[aria-current="page"]{color:var(--fg)}
  .nav a svg{display:block}
  .nav .c{position:absolute;top:1px;left:calc(50% + 7px);margin:0;background:var(--bad);color:#fff;border-radius:9px;padding:0 5px;font-size:10.5px;opacity:1}
  body{padding-bottom:100px}
}
main{padding-top:32px}

/* Plan du jour */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.plan-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.plan-h h2{font-size:26px;line-height:1.15}
.plan-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:52ch}
.budget{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted)}
.budget button{background:none;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.budget button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}
.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.steps li::before{content:counter(st);width:22px;height:22px;border-radius:50%;border:1px solid var(--faint);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.steps a{text-decoration:none;min-width:0}
.steps .w{font-size:15px}
.steps .w b{font-weight:600}
.steps .y{font-size:12.5px;color:var(--muted);margin-top:2px}
.steps .t{font-family:var(--f-mono);font-size:12.5px;color:var(--faint);white-space:nowrap}
.tagk{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.k-retard{background:var(--bad-bg);color:var(--bad-fg)} .k-reprise{background:var(--miss-bg);color:var(--miss-fg)} .k-suite{background:var(--blk-bg);color:var(--blk-fg)} .k-nouveau{background:var(--ok-bg);color:var(--ok-fg)}
.plan-f{font-size:12.5px;color:var(--faint);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.plan-f b{color:var(--muted);font-weight:500}
.why{font-size:12.5px;color:var(--faint);line-height:1.55}
details.algo summary{cursor:pointer;color:var(--muted);font-size:12.5px}
details.algo div{margin-top:8px}

/* Listes */
.block-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.block-title h2{font-size:22px}
.block-title span{font-size:13px;color:var(--muted)}
.chap{display:flex;flex-direction:column}
.chap > button{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:18px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.chap > button:hover{background:var(--hover)}
.chap .n{font-family:var(--f-display);font-size:32px;line-height:1;grid-row:span 2;color:var(--fg)}
.chap .det{display:block;font-family:var(--f-body,inherit);font-size:12px;color:var(--faint);margin-top:3px;font-weight:400}
.chap .ti{font-family:var(--f-display);font-size:21px;line-height:1.2}
.chap .sub{font-size:12.5px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chap .go{grid-row:span 2;color:var(--faint);transition:transform .2s}
.chap > button[aria-expanded="true"] .go{transform:rotate(90deg)}
.bar{display:flex;height:5px;width:120px;border-radius:3px;overflow:hidden;background:var(--todo);gap:2px}
.bar span{display:block;height:100%}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:13px 6px 13px 10px;border-bottom:1px solid var(--line);border-left:3px solid transparent;text-decoration:none}
.row:hover{background:var(--hover)}
.row .t{font-size:15px;min-width:0}
.row .m{font-size:12.5px;color:var(--faint);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .s{font-size:12.5px;text-align:right;white-space:nowrap}
.row.st0{border-left-color:var(--blk)} .row.st1{border-left-color:var(--miss)} .row.st2{border-left-color:var(--redo)} .row.st3{border-left-color:var(--green)} .row.st4{border-left-color:var(--ok)}
.c0{color:var(--blk-fg)} .c1{color:var(--miss-fg)} .c2{color:var(--redo-fg)} .c3{color:var(--green)} .c4{color:var(--ok-fg)} .cbad{color:var(--bad-fg)}
.stars{display:inline-flex;gap:1px;vertical-align:-2px}
.stars svg{width:13px;height:13px}
.qbar{display:flex;gap:2px;flex-wrap:wrap;max-width:240px}
.qbar i{width:8px;height:8px;border-radius:2px;background:var(--todo);display:block}
.qbar i.q0{background:var(--bad)} .qbar i.q1{background:var(--bad)} .qbar i.q2{background:var(--miss)} .qbar i.q3{background:var(--green)} .qbar i.qd{background:var(--ok)}
.qbar i.imp{box-shadow:0 0 0 1px var(--gold)}
.empty{font-size:14px;color:var(--muted);padding:18px 4px;border-bottom:1px solid var(--line)}
.sync{font-size:12px;color:var(--faint);text-align:center}

/* Fiche (papier) */
.sheet{background:var(--paper);color:var(--ink);border-radius:14px;overflow:hidden}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(18px,5vw,48px);border-bottom:1px solid var(--ink-line);font-size:13px;color:var(--ink-muted);flex-wrap:wrap}
.sh-top a{color:var(--ink-muted);text-decoration:none} .sh-top a:hover{color:var(--ink)}
.gl{font-size:13px;color:var(--ink-muted);margin:6px 0 0} .gl a{display:inline-block;margin:0 4px 4px 0;padding:1px 8px;border:1px solid var(--ink-line);border-radius:10px;color:var(--ink);text-decoration:none}
.sh-body{padding:30px clamp(18px,5vw,56px) 40px;font-family:"CMU Serif","Latin Modern Roman",Georgia,serif;font-size:18px;line-height:1.6}
.sh-body h2{font-family:"CMU Serif",Georgia,serif;font-weight:700;font-size:22px;letter-spacing:0;line-height:1.3;margin:4px 0 10px}
.sh-body p{margin:0 0 .8em} .sh-body ol,.sh-body ul{margin:0 0 .8em;padding-left:1.4em} .sh-body li{margin:.35em 0} .sh-body li::marker{font-weight:700}
.sh-body .note{font-style:italic;color:var(--ink-muted);font-size:.92em;border-left:3px solid var(--ink-line);padding-left:10px}
.sh-body pre{margin:0 0 .8em;padding:10px 14px;background:var(--ink-soft);border:1px solid var(--ink-line);border-radius:8px;overflow-x:auto;font-family:var(--f-mono);font-size:.76em;line-height:1.55;white-space:pre}
.sh-body code{font-family:var(--f-mono);font-size:.82em}

.tl .y{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--muted)}
.tl .y .wy{color:var(--faint)}
.tl .t{font-family:var(--f-mono);font-size:12.5px;color:var(--faint);white-space:nowrap}

.tagk.k-carnet{background:#2b2d33;color:var(--muted)}
.exmain .head{margin-bottom:16px}
.tabs.doms{margin-top:-4px;border:0;padding-top:0}

.lg-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;text-align:center}
.lg-logo{display:flex;gap:10px;justify-content:center;margin-bottom:6px}
.lg-logo span{width:18px;height:18px;border-radius:50%;background:var(--miss)}
.lg-logo span:nth-child(2){background:var(--redo)}.lg-logo span:nth-child(3){background:var(--val)}
.lg-card h1{font-family:var(--f-display);font-weight:500;font-size:28px;margin:0}
.lg-sub{color:var(--muted);font-size:14px;margin:0 0 8px}

.lg-ghost{font:inherit;padding:11px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}

.lg-msg{min-height:1.2em;color:var(--miss-fg);font-size:13.5px}
.reglages{margin:24px 0 8px;border-top:1px solid var(--line);padding-top:14px;font-size:13.5px;color:var(--muted)}
.reglages summary{cursor:pointer;color:var(--fg);font-weight:500}
.rg{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.rg p{margin:0}.rg b{color:var(--fg);font-weight:600}
.rg-row{display:flex;flex-wrap:wrap;gap:6px}
.rg-row input{flex:1 1 200px;min-width:0;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.rg button,.rg-imp{font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-block}
.rg .rg-link{padding:0;border:0;background:none;text-decoration:underline;color:var(--muted)}
.rg-msg{color:var(--fg)}
.foot{margin-top:40px}

}

for(const x of ITEMS){ if(x.niv !== "geste") for(const g of (x.gs || (x.geste ? [x.geste] : []))) (GUSE[g] = GUSE[g] || []).push(x); }
const qrange = x => x.qs.length ? (x.qs[0].id === x.qs[x.qs.length - 1].id ? "Q" + x.qs[0].id : "Q" + x.qs[0].id + " → Q" + x.qs[x.qs.length - 1].id) : "";
function splitBlocs(x){
  const tot = x.qs.reduce((s, q) => s + q.min, 0);
  if(tot <= CAP || x.qs.length < 2) return [x];
  const k = Math.ceil(tot / CAP), tgt = tot / k, parts = []; let cur = [], m = 0;
  for(const q of x.qs){
    if(cur.length && (m + q.min > CAP || (m >= tgt && parts.length < k - 1))){ parts.push(cur); cur = []; m = 0; }
    cur.push(q); m += q.min;
  }
  if(cur.length) parts.push(cur);
  return parts.map((qs, i) => ({...x, id: x.id + "#" + (i + 1), base: x.id, part: i + 1, nparts: parts.length, qs, dur: qs.reduce((s, q) => s + q.min, 0)}));
}
for(const x of ITEMS.filter(x => x.kind === "ex")){
  const ps = splitBlocs(x);
  if(ps.length > 1){ x.parts = ps; ps.forEach(q => { BY[q.id] = q; EXS.push(q); }); } else EXS.push(x);
}

}

const DAY = 864e5;

/* ---------- Exercices : répétition espacée ----------
   Bloqué → lendemain · Pas réussi → J+2 · À refaire → J+4 · Réussi → J+10, puis J+25, puis maîtrisé (3 réussites d'affilée) */
const S_LABEL = ["Bloqué", "Pas réussi", "À refaire", "Réussi"];
/* Trois niveaux, trois rythmes : geste (≈8 min) · exercice (≈28 min).
   Geste : J+1, 3, 7, 16, 35, puis entretien J+60, J+120 · échec : lendemain si l'idée n'est pas venue, sinon J+2 · maîtrisé après 5 réussites.
   Exercice : J+3, 10, 25, puis entretien J+60 · échec : J+1 (bloqué) ou J+2 · maîtrisé après 3 réussites. */
const nivOf = x => (x && x.niv) || (x && x.kind === "pb" ? "probleme" : "exercice");
const gsOf = x => x.gs || (x.geste ? [x.geste] : []);
const NIV_NAME = {geste: "Geste", exercice: "Exercice", probleme: "Problème"};
const GAPS = {geste: {ok: [1, 3, 7, 16, 35, 60, 120], fail: {0: 1, 1: 2, 2: 2}, master: 5},
              exercice: {ok: [3, 10, 25, 60], fail: {0: 1, 1: 2, 2: 2}, master: 3}};
const SPRINT = new Date("2027-03-10").getTime();           // dernières semaines avant les écrits : intervalles divisés par 2
const compress = n => today0() >= SPRINT ? Math.max(1, Math.round(n / 2)) : n;
const TOTAL_GESTES = PROTO.filter(x => x.niv === "geste").length;
const CAUSES = {idee: "Idée non trouvée", calcul: "Erreur de calcul", redac: "Rédaction", lent: "Trop lent"};

function markEx(id, s, inTime, why){
  const x = BY[id], niv = nivOf(x), G = GAPS[niv] || GAPS.exercice;
  const r = EX[id] ? {...EX[id]} : {n: 0, h: []};
  const t = today0();
  r.s = s; r.last = t; r.h = [...(r.h || []), [t, s]].slice(-12); r.slow = false;
  if(s === 3){
    r.n = (r.n || 0) + 1; r.cause = null;
    if(r.n >= G.master && !inTime){ r.n = G.master - 1; r.slow = true; r.due = addDays(t, compress(niv === "geste" ? 3 : 7)); }   // maîtrise seulement dans le temps cible
    else r.due = addDays(t, compress(G.ok[Math.min(r.n - 1, G.ok.length - 1)]));
  }
  else { r.n = 0; r.cause = why || null; r.due = addDays(t, compress(niv === "geste" ? ((s === 0 || why === "idee") ? 1 : 2) : G.fail[s])); }
  EX[id] = r; save("ex2", id, r);
}
const exCat = (r, x) => !r ? -1 : (r.s === 3 && r.n >= (GAPS[nivOf(x)] || GAPS.exercice).master) ? 4 : r.s;   // 4 = maîtrisé

/* ---------- Problèmes : suivi question par question ----------
   r : 0 non traité · 1 faux · 2 partiel · 3 juste
   Faux / non traité → J+3, puis J+10, puis J+30 · Partiel → J+7, puis J+21 · Juste deux fois d'affilée → acquis.
   Une question annexe (calcul) juste du premier coup est acquise tout de suite. */
const R_LABEL = ["Non traité", "Faux", "Partiel", "Juste"];
const FAIL_GAP = [3, 10, 30], PART_GAP = [7, 21];
function markQ(pid, q, r){
  const P = PQ[pid] = PQ[pid] || {};
  const o = P[q.id] ? {...P[q.id]} : {st: 0, sk: 0, h: []};
  const t = today0();
  const failedBefore = (o.h || []).some(([, x]) => x < 3);
  o.r = r; o.last = t; o.h = [...(o.h || []), [t, r]].slice(-10);
  if(r <= 1){ o.sk = 0; o.st = 0; o.due = addDays(t, FAIL_GAP[0]); o.done = false; }
  else if(r === 2){ o.sk = 0; o.due = addDays(t, PART_GAP[Math.min(o.st, 1)]); o.st = Math.min(o.st + 1, 2); o.done = false; }
  else {
    o.sk = (o.sk || 0) + 1;
    if(o.sk >= 2 || (!failedBefore && q.imp >= 3)){ o.done = true; o.due = null; }
    else { o.st = Math.min((o.st || 0) + 1, 2); o.due = addDays(t, failedBefore ? FAIL_GAP[o.st] : 30); o.done = false; }
  }
  P[q.id] = o;
}

/* ---------- Le moteur de priorité ----------
   Score d'une reprise = poids(importance) × gravité(dernier résultat) × (1 + retard / intervalle prévu) × (1 + 0,5 × nb de questions ratées qui en dépendent)
   – importance : ★ classique 3 · standard 1,6 · calcul 1
   – gravité : non traité 3 · faux 2,6 · partiel 1,8 · juste (vérification) 1
   – on reprend toujours une question avec les questions ratées dont elle dépend, dans l'ordre du sujet
   Puis on remplit le budget de temps : reprises par score décroissant, ensuite le problème entamé, ensuite un nouveau problème (le plus important, de préférence sur un thème où les exercices coincent) si au moins 40 min restent. */
const IMP_W = {1: 3, 2: 1.6, 3: 1}, SEV_Q = {0: 3, 1: 2.6, 2: 1.8, 3: 1};
const LVL_W = {1: 3, 2: 2, 3: 1.3}, SEV_EX = {0: 3, 1: 2.6, 2: 1.8, 3: 1};
const RETAKE = 0.8;   // une question déjà vue se refait plus vite

function qScore(p, q, o, t){
  const late = Math.max(0, daysBetween(o.due, t));

/* Note estimée : part des points obtenus (poids = minutes de la question ; ✓ = 1, ½ = 0,5) puis courbe « % de points → note » tirée des rapports de jury

const CURVES = {prov: [[0, 0], [.095, 5.1], [.23, 10.1], [.36, 15], [.585, 20]], paris: [[0, 0], [.13, 10], [.2, 13], [.58, 20]]};

function planProblems(budget){

    const P = PQ[p.id] || {};
    for(const q of p.qs){ const o = P[q.id]; if(o && !o.done && o.due != null && o.due <= t) cands.push({p, q, o, sc: qScore(p, q, o, t), late: daysBetween(o.due, t)}); }

  const add = (p, q) => { if(!chosen.has(p.id)) chosen.set(p.id, new Set()); chosen.get(p.id).add(q.id); };

    if(extra > left && steps.length + chosen.size > 0) continue;
    if(chosen.has(c.p.id) && (spent.get(c.p.id) || 0) + extra > CAP) continue;
    spent.set(c.p.id, (spent.get(c.p.id) || 0) + extra);

    const p = BY[pid], P = PQ[pid] || {};

    for(const q of p.qs){ if(P[q.id] || chosen.get(p.id)?.has(q.id)) continue; if(m + q.min > Math.min(left, CAP) && qs.length) break; qs.push(q); m += q.min; }

      .map(p => ({p, sc: LVL_W[p.lvl || 2] * 10 + (p.tags || []).reduce((s, tg) => s + (weak[tg] || 0), 0)}))
      .sort((a, b) => b.sc - a.sc);
    if(fresh.length){
      const p = fresh[0].p, qs = []; let m = 5;
      for(const q of p.qs){ if(m + q.min > Math.min(left, CAP) && qs.length) break; qs.push(q); m += q.min; }

function exScore(x, r, t){

}
function chapterWeakness(){
  const w = {};

  return w;

function planExercises(budget, mode){
  const POOL = EXS.filter(x => mode === "geste" ? nivOf(x) === "geste" : nivOf(x) !== "geste");
  const t = today0(), steps = []; let left = budget;
  let due = POOL.filter(x => EX[x.id] && EX[x.id].due != null && EX[x.id].due <= t)
    .map(x => ({x, r: EX[x.id], sc: exScore(x, EX[x.id], t) * (nivOf(x) === "geste" ? (x.freq || 2) / 2 : 1)})).sort((a, b) => b.sc - a.sc);
  { let ng = 0; due = due.filter(d => nivOf(d.x) !== "geste" || ++ng <= 4); }   // 4 gestes de révision par jour au maximum

    const late = daysBetween(d.r.due, t);

    left -= m;
  }

  const weak = chapterWeakness();
  const okG = () => true;
  let fresh = POOL.filter(x => !EX[x.id] && isSeen(x.ch) && okG(x));
  if(!fresh.length) fresh = POOL.filter(x => !EX[x.id] && okG(x));
  fresh.sort((a, b) => (nivOf(a) === "geste" ? 0 : 1) - (nivOf(b) === "geste" ? 0 : 1) || (b.freq || 2) - (a.freq || 2) || TIER_ORD[tierOf(a)] - TIER_ORD[tierOf(b)] || (a.lvl || 2) - (b.lvl || 2) || (weak[b.ch] || 0) - (weak[a.ch] || 0) || CH_ORDER.indexOf(a.ch) - CH_ORDER.indexOf(b.ch) || a.year - b.year);
  let newG = 0;
  for(const x of fresh){
    const g = nivOf(x) === "geste";
    if(g ? newG >= 2 : left < 25) { if(g) continue; else break; }   // au plus 2 nouveaux gestes par séance
    const m = Math.min(x.dur || 45, CAP);
    if(m > left + (g ? 0 : 10)) continue;

  }

  for(const x of POOL){ const r = EX[x.id]; if(r && r.due != null && r.due > t){ if(nx == null || r.due < nx){ nx = r.due; nn = 0; } if(r.due === nx) nn++; } }
  return {steps, used: budget - left, next: nx == null ? null : {t: nx, n: nn}};
}

function migrateParts(){ for(const x of ITEMS){ if(x.parts && EX[x.id]) for(const p of x.parts) if(!EX[p.id]) EX[p.id] = {...EX[x.id]}; } }

/* ================= Version indépendante : Firebase (synchro) + Gemini (indices, corrections) ================= */
/* Gemini : imite l'interface utilisée par l'app (limits / json) */
const GEM_BASE = "https://generativelanguage.googleapis.com/v1beta";
const lsGet = k => { try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } };
const lsSet = (k, v) => { try{ v ? localStorage.setItem(k, v) : localStorage.removeItem(k); }catch(e){} };
let gemKey = lsGet("gemkey");
async function blobToB64(b){
  const buf = new Uint8Array(await b.arrayBuffer()); let s = "";
  for(let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
}
async function gemModels(){
  const cached = lsGet("gemmodels");
  if(cached){ try{ const c = JSON.parse(cached); if(c.k === gemKey.slice(-6) && Date.now() - c.t < 3 * 864e5) return c.m; }catch(e){} }
  let list = [];
  try{
    const r = await fetch(`${GEM_BASE}/models?pageSize=200`, {headers: {"x-goog-api-key": gemKey}});
    if(r.ok){
      const j = await r.json();
      list = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
        .map(m => m.name.replace(/^models\//, ""))
        .filter(n => /flash/.test(n) && !/lite|image|tts|live|audio|embed|exp|8b|latest/.test(n));
      const ver = n => { const m = n.match(/gemini-(\d+)(?:\.(\d+))?/); return m ? +m[1] * 100 + +(m[2] || 0) : 0; };
      list.sort((a, b) => (ver(b) - ver(a)) || ((/preview/.test(a) ? 1 : 0) - (/preview/.test(b) ? 1 : 0)));
    }
  }catch(e){}
  if(!list.includes("gemini-2.5-flash")) list.push("gemini-2.5-flash");
  lsSet("gemmodels", JSON.stringify({k: gemKey.slice(-6), t: Date.now(), m: list}));
  return list;
}
const GEM = async () => ({text: ""});
const ckErr = {no_key: "Ajoute ta clé Gemini dans Réglages (en bas de la page d'accueil).", bad_key: "Clé Gemini refusée : vérifie-la dans Réglages.", overloaded: "Gemini est surchargé : réessaie dans une minute.", network: "Pas de connexion internet.", refused: "Gemini a refusé la demande.", invalid_json: "Réponse illisible de Gemini : réessaie.", empty_completion: "Réponse vide de Gemini : réessaie."};
GEM.limits = async () => ({images: {maxCount: 6, maxInputBytes: 15e6, mediaTypes: ["image/jpeg", "image/png", "image/webp"]}});
GEM.json = async (prompt, opts = {}) => {
  if(!gemKey) throw {code: "no_key"};
  if(!navigator.onLine) throw {code: "network"};
  const parts = [{text: prompt}];
  for(const b of (opts.images || [])) parts.push({inline_data: {mime_type: b.type || "image/jpeg", data: await blobToB64(b)}});
  const body = JSON.stringify({contents: [{role: "user", parts}], generationConfig: {responseMimeType: "application/json", temperature: 0.2, maxOutputTokens: opts.maxTokens || 8192}});
  const pinned = lsGet("gemmodel");
  let models = pinned ? [pinned] : await gemModels();
  const ok0 = lsGet("gemok"); if(!pinned && ok0 && models.includes(ok0)) models = [ok0].concat(models.filter(m => m !== ok0));   // le dernier modèle qui a marché d'abord
  let last = {code: "upstream"};
  for(const model of models){
    let r;
    try{ r = await fetch(`${GEM_BASE}/models/${model}:generateContent`, {method: "POST", headers: {"Content-Type": "application/json", "x-goog-api-key": gemKey}, body, signal: opts.signal}); }
    catch(e){ if(e && e.name === "AbortError") throw {code: "cancelled"}; throw {code: "network"}; }
    if(r.ok){
      const j = await r.json();
      const cand = j.candidates && j.candidates[0];
      if(!cand){ throw {code: j.promptFeedback && j.promptFeedback.blockReason ? "refused" : "empty_completion"}; }
      const txt = ((cand.content && cand.content.parts) || []).filter(p => p.text && !p.thought).map(p => p.text).join("");
      if(!txt) throw {code: cand.finishReason === "SAFETY" ? "refused" : "empty_completion"};
      lsSet("gemok", model);
      try{ return JSON.parse(txt); }catch(e){ const m = txt.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e2){} } throw {code: "invalid_json"}; }
    }
    let msg = ""; try{ msg = JSON.stringify(await r.json()); }catch(e){}
    if(r.status === 400 && /API_KEY_INVALID|API key not valid/i.test(msg)) throw {code: "bad_key"};
    if(r.status === 401 || r.status === 403) throw {code: "bad_key"};
    if(r.status === 503 || r.status === 500){ last = {code: "overloaded"}; continue; }
    if(r.status === 429){ last = {code: "rate_limited"}; if(/limit: 0|free_tier/i.test(msg)) continue; throw last; }   // modèle non gratuit → on essaie le suivant
    if(r.status === 404){ continue; }
    last = {code: "upstream"};
  }
  throw last;
};

/* Connexion (e-mail + mot de passe) puis base Firestore propre à l'utilisateur */
function fbReady(){ return window.FB ? Promise.resolve(window.FB) : new Promise((res, rej) => { window.addEventListener("fb-ready", () => res(window.FB), {once: true}); setTimeout(() => rej(new Error("fb")), 20000); }); }
let fbUser = null;
async function appLogin(){
  const FB = await fbReady();
  const user = await new Promise(res => { const un = FB.onAuth(u => { un(); res(u); }); });
  fbUser = user || await showLogin(FB);
  $("#login").hidden = true;
  const store = FB.db(fbUser.uid);
  // clé Gemini synchronisée entre tes appareils (lisible par toi seul, règles Firestore)
  store.collection("secret").onSnapshot(snap => { snap.docs.forEach(d => { if(d.id === "gemini"){ const v = d.data() || {}; if(v.key && v.key !== gemKey){ gemKey = v.key; lsSet("gemkey", gemKey); renderSettings(); } } }); }, () => {});
  store.collection("content2").onSnapshot(snap => {
    let n = 0;
    snap.docs.forEach(d => { const v = d.data(); const x = BY[d.id]; if(x && v && v.j){ try{ const o = JSON.parse(v.j); x.e = o.e; x.c = o.c; (x.parts || []).forEach(q => { q.e = o.e; q.c = o.c; }); n++; }catch(e){} } });
    const empty = !snap.docs.length; const r = document.querySelector(".reglages");
    if(empty && !snap.metadata.fromCache){ rgMsg().textContent = "Énoncés et corrigés absents : importe contenu-analyse.json ici."; if(r) r.open = true; }
    if(cur && cur.e && !document.querySelector("#sol")?.textContent.trim().length) openItem(cur.id);
    else if(cur && cur.e && /Énoncé absent/.test($("#main").textContent)) openItem(cur.id);
  }, () => {});
  window.STORE = store; renderSettings();
  return store;
}
function showLogin(FB){
  return new Promise(res => {
    const box = $("#login"); box.hidden = false;
    const msg = $("#lg-msg"), em = $("#lg-email"), pw = $("#lg-pass");
    const go = async create => {
      msg.textContent = create ? "Création du compte…" : "Connexion…";
      try{ const c = create ? await FB.signUp(em.value.trim(), pw.value) : await FB.signIn(em.value.trim(), pw.value); res(c.user); }
      catch(e){
        const c = (e && e.code) || "";
        msg.textContent = /invalid-credential|wrong-password|user-not-found/.test(c) ? "E-mail ou mot de passe incorrect (première fois ? crée ton compte)." :
          /email-already-in-use/.test(c) ? "Ce compte existe déjà : connecte-toi." : /weak-password/.test(c) ? "Mot de passe trop court (6 caractères minimum)." :
          /invalid-email/.test(c) ? "Adresse e-mail invalide." : /network/.test(c) ? "Pas de connexion internet." : "Connexion impossible : " + c;
      }
    };
    $("#lg-in").onclick = e => { e.preventDefault(); go(false); };
    $("#lg-up").onclick = e => { e.preventDefault(); go(true); };
    $("#lg-reset").onclick = async e => { e.preventDefault(); try{ await FB.reset(em.value.trim()); msg.textContent = "E-mail de réinitialisation envoyé."; }catch(err){ msg.textContent = "Indique d'abord ton e-mail."; } };
  });
}
/* Réglages : clé Gemini, modèle, import, déconnexion */
function renderSettings(){
  const k = $("#rg-key"); if(!k) return;
  $("#rg-keystate").textContent = gemKey ? `Clé enregistrée (…${gemKey.slice(-4)})` : "Aucune clé : les indices et corrections sont désactivés.";
  $("#rg-model").textContent = lsGet("gemmodel") || (lsGet("gemok") ? `automatique (${lsGet("gemok")})` : "automatique");

}
document.addEventListener("click", async e => {
  const id = e.target && e.target.id;
  if(id === "rg-save"){
    const v = $("#rg-key").value.trim(); if(!v) return;
    gemKey = v; lsSet("gemkey", v); lsSet("gemmodels", ""); $("#rg-key").value = "";
    if(window.STORE){ try{ await window.STORE.collection("secret").doc("gemini").set({key: v}); }catch(err){} }
    renderSettings();
  }
  if(id === "rg-out" && window.FB){ await window.FB.signOut(); location.reload(); }
  if(id === "rg-test"){
    const st = rgMsg(); st.textContent = "Test en cours…";
    try{ const r = await GEM.json('Réponds uniquement avec ce JSON : {"ok": true}'); st.textContent = r && r.ok ? `Gemini répond (modèle ${lsGet("gemok")}).` : "Réponse inattendue."; }
    catch(err){ st.textContent = ckErr[err && err.code] || "Échec : " + (err && err.code); }
    renderSettings();

});
document.addEventListener("change", async e => {
  if(!e.target || e.target.id !== "rg-import") return;
  const f = e.target.files && e.target.files[0]; const st = rgMsg(); if(!f || !window.FB || !fbUser) return;
  try{
    const data = JSON.parse(await f.text()); st.textContent = "Import en cours…";
    let n = 0, fails = [];
    const order = Object.keys(data).sort((a, b) => (a === "content" ? -1 : 0) - (b === "content" ? -1 : 0));   // énoncés d'abord
    const total = order.reduce((s, c) => s + (data[c] && typeof data[c] === "object" ? Object.keys(data[c]).length : 0), 0);
    for(const col of order){
      const obj = data[col]; if(!obj || typeof obj !== "object") continue;
      for(const [id, v] of Object.entries(obj)){
        try{ await window.STORE.collection(col).doc(id).set(v); n++; }
        catch(err){ fails.push(`${col}/${id} : ${(err && (err.code || err.message)) || err}`); }
        st.textContent = `Import en cours… ${n + fails.length} / ${total}`;
      }
    }
    st.textContent = fails.length ? `Import : ${n} éléments enregistrés, ${fails.length} en échec. ${fails.slice(0, 3).join(" · ")}` : `Import terminé : ${n} éléments (énoncés et corrigés compris).`;
  }catch(err){ st.textContent = "Fichier illisible : " + ((err && err.message) || err); }
  e.target.value = "";
});

const writes = {};
function save(col, id, val){
  if(!db){ try{ localStorage.setItem("classiques-v2", JSON.stringify({EX, PQ, CN, SET})); }catch(e){} return; }
  const ref = db.collection(col).doc(id), k = col + "/" + id;
  writes[k] = (writes[k] || Promise.resolve()).then(() => val ? ref.set(col === "pq" ? {j: JSON.stringify(val)} : val) : ref.delete()).catch(() => { $("#sync").textContent = "Enregistrement impossible, réessaie"; });
}
async function init(){
  route();

  try{ db = await appLogin(); }catch(e){ db = null; }
  if(!db){
    try{ const s = JSON.parse(localStorage.getItem("classiques-v2") || "{}"); EX = s.EX || {}; migrateParts(); PQ = s.PQ || {}; CN = s.CN || {}; SET = {...SET, ...(s.SET || {})}; }catch(e){}
    $("#sync").textContent = "Enregistré sur cet appareil"; if(!cur) render(); else { counts(); renderWork(); } return;
  }
  const timer = setTimeout(() => { $("#sync").textContent = "Synchronisation lente…"; }, 10000);
  const rerender = () => { if(cur){ counts(); renderWork(); } else render(); };
  db.collection("ex2").onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { const v = d.data(); if(v && v.s != null) o[d.id] = v; }); EX = o; migrateParts(); rerender(); clearTimeout(timer); $("#sync").textContent = "Synchronisé"; }, () => { $("#sync").textContent = "Synchronisation interrompue"; });
  db.collection("pq").onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { try{ o[d.id] = JSON.parse(d.data().j); }catch(e){} }); PQ = o; rerender(); }, () => {});
  db.collection("custom2").onSnapshot(snap => { snap.docs.forEach(d => { try{ const x = JSON.parse(d.data().j); x.id = d.id; addItem(x); }catch(e){} }); rerender(); }, () => {});
  db.collection("carnet2").onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { const v = d.data(); if(v && v.q) o[d.id] = v; }); CN = o; rerender(); }, () => {});
  db.collection("settings").onSnapshot(snap => { snap.docs.forEach(d => { if(d.id === "main") SET = {...SET, ...d.data()}; }); if(!cur) render(); }, () => {});
}
init();
